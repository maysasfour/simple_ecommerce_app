name: Build Flutter Web

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          flutter pub get 2>&1 | tee pub-get.log
          pub_status=${PIPESTATUS[0]}
          if [ "$pub_status" -ne 0 ]; then
            message=$(tail -n 40 pub-get.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Flutter dependency resolution failed::$message"
            exit "$pub_status"
          fi

      - name: Build web
        shell: bash
        run: |
          set +e
          flutter build web --release --base-href / 2>&1 | tee flutter-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            message=$(tail -n 60 flutter-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Flutter web build failed::$message"
            exit "$build_status"
          fi

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
